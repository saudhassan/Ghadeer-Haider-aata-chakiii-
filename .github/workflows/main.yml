name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "ghadeer-haider-aata-chakki",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.5.2 @capacitor/cli@8.5.2 @capacitor/android@8.5.2

      - name: Create Android project
        run: |
          npx cap init "Ghadeer Haider Aata Chakki" "com.ghadeerhaider.aatachakki" --web-dir .
          npx cap add android
          npx cap copy android

      - name: Build Android AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Ghadeer-Haider-Aata-Chakki-AAB
          path: android/app/build/outputs/bundle/release/*.aab
