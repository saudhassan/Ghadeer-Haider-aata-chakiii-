name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create Capacitor project
        run: |
          cat > package.json <<'EOF'
          {
            "name": "ghadeer-haider-aata-chakki",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo website-ready"
            },
            "dependencies": {
              "@capacitor/core": "8.5.2"
            },
            "devDependencies": {
              "@capacitor/cli": "8.5.2"
            }
          }
          EOF

          npm install

          npx cap init "Ghadeer Haider Aata Chakki" "com.ghadeerhaider.aatachakki" --web-dir .

          npm install @capacitor/android@8.5.2

          npx cap add android

          npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Ghadeer-Haider-Aata-Chakki-AAB
          path: android/app/build/outputs/bundle/release/*.aab
