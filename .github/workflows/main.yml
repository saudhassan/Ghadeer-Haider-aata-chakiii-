name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout website
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Create package.json
        run: npm init -y

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare website
        run: |
          mkdir -p www
          cp -r ./* www/ 2>/dev/null || true

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ghadeerhaider.aatachakki",
            "appName": "Ghadeer Haider Aata Chakki",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Copy website to Android
        run: npx cap copy android

      - name: Build Android AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Ghadeer-Haider-Aata-Chakki-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
